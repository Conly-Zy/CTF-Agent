services:
  ctf-agent:
    image: ${CTF_AGENT_IMAGE:-ghcr.io/conly-zy/ctf-agent}:${CTF_AGENT_IMAGE_TAG:-latest}
    container_name: ${CTF_AGENT_CONTAINER_NAME:-ctf-agent}
    restart: unless-stopped
    ports:
      - "${CTF_PORT:-4399}:4399"
    environment:
      CTF_AGENT_ADDR: ":4399"
      CTF_AGENT_CONFIG: /data/config.yaml
      CTF_AGENT_DB: /data/ctf-agent.db
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-4-7}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    command: ["server", "--addr", ":4399", "--config", "/data/config.yaml", "--db", "/data/ctf-agent.db"]
    volumes:
      - ./data:/data
      - ./uploads:/uploads
      - ./logs:/logs
      - ./plugins:/app/plugins:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4399/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    image: alpine:3.22
    container_name: ${CTF_AGENT_BACKUP_CONTAINER_NAME:-ctf-agent-backup}
    restart: unless-stopped
    profiles: ["backup"]
    volumes:
      - ./data:/source:ro
      - ./backups:/backup
    entrypoint: /bin/sh
    command: >
      -c "
      apk add --no-cache sqlite &&
      while true; do
        if [ -f /source/ctf-agent.db ]; then
          sqlite3 /source/ctf-agent.db '.backup /backup/ctf-agent-'$$(date +%Y%m%d%H%M%S)'.db' &&
          echo 'Backup completed at '$$(date) &&
          find /backup -name '*.db' -mtime +7 -delete;
        fi;
        sleep 3600;
      done
      "
