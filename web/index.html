<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF-Agent Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <h1>CTF-Agent</h1>
        </div>
        <ul class="nav-links">
            <li><a href="#" class="active" data-page="dashboard">Dashboard</a></li>
            <li><a href="#" data-page="sessions">Sessions</a></li>
            <li><a href="#" data-page="knowledge">Knowledge</a></li>
        </ul>
    </nav>

    <main class="content">
        <!-- Dashboard Page -->
        <div id="dashboard" class="page active">
            <h2>Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Sessions</h3>
                    <p class="stat-value" id="stat-total">0</p>
                </div>
                <div class="stat-card">
                    <h3>Success Rate</h3>
                    <p class="stat-value" id="stat-rate">0%</p>
                </div>
                <div class="stat-card">
                    <h3>Avg Duration</h3>
                    <p class="stat-value" id="stat-duration">0s</p>
                </div>
            </div>
            <div class="type-stats" id="type-stats"></div>
            <h3>Recent Sessions</h3>
            <div class="session-list" id="recent-sessions"></div>
        </div>

        <!-- Sessions Page -->
        <div id="sessions" class="page">
            <h2>Sessions</h2>
            <div class="filters">
                <select id="session-type-filter">
                    <option value="">All Types</option>
                    <option value="web">Web</option>
                    <option value="pwn">Pwn</option>
                    <option value="crypto">Crypto</option>
                    <option value="reverse">Reverse</option>
                </select>
                <select id="session-status-filter">
                    <option value="">All Status</option>
                    <option value="success">Success</option>
                    <option value="failed">Failed</option>
                    <option value="solving">Solving</option>
                </select>
            </div>
            <div class="session-list" id="all-sessions"></div>
        </div>

        <!-- Knowledge Page -->
        <div id="knowledge" class="page">
            <h2>Knowledge Base</h2>
            <div class="search-box">
                <input type="text" id="knowledge-search" placeholder="Search knowledge...">
                <button onclick="searchKnowledge()">Search</button>
            </div>
            <div class="filters">
                <select id="knowledge-type-filter">
                    <option value="">All Types</option>
                    <option value="technique">Technique</option>
                    <option value="vulnerability">Vulnerability</option>
                    <option value="exploit">Exploit</option>
                    <option value="analysis">Analysis</option>
                </select>
            </div>
            <div class="knowledge-list" id="knowledge-list"></div>
        </div>

        <!-- Detail Modal -->
        <div id="detail-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="detail-content"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
